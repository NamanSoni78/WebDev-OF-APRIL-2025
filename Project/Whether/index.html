<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="d13Hh8m2coFjR-lHc63J8TJZSHc95Q5bJAxervsJEtk" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNDWhether</title>
    <link rel="stylesheet" href="whether-style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter City Name" spellcheck="false">
            <button><img src="whetherresrc/search.png"></button>
        </div>
        <div class="error">
            <p>Please Insert Valid City Name</p>
        </div>
        <div class="whether">
            <img src="whetherresrc/rain.png" class="whether-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">New York</h2>
            <div class="details">
                <div class="col">
                    <img src="whetherresrc/humidity.png">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                    <div class="col">
                        <img src="whetherresrc/wind.png">
                        <div>
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script>    
        const apiKey = "e2eaba7a435a9f16fd4bd78cd6fc8ba0";
        const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";
        const searchBox = document.querySelector(".search input")
        const searchBtn = document.querySelector(".search button")
        const whetherIcon = document.querySelector(".whether-icon")
        async function checkWhether(city){
            const response = await fetch(apiUrl + city + `&appid=${apiKey}`);
            if(response.status == 404){
                document.querySelector(".error").style.display = "block" ,             document.querySelector(".whether").style.display = "none";
            }
            var data = await response.json();
            console.log(data);
            document.querySelector(".city").innerHTML = data.name;
            document.querySelector(".temp").innerHTML = Math.round(data.main.temp)+"°C";
            document.querySelector(".humidity").innerHTML = data.main.humidity +"%";
            document.querySelector(".wind").innerHTML = data.wind.speed +" km/h";
            if(data.weather[0].main == "Clouds"){
                whetherIcon.src = "whetherresrc/clouds.png";
            }
            else if(data.weather[0].main == "Clear"){
                whetherIcon.src = "whetherresrc/clear.png";
            }
            else if(data.weather[0].main == "Rain"){
                whetherIcon.src = "whetherresrc/rain.png";
            }
            else if(data.weather[0].main == "Drizzle"){
                whetherIcon.src = "whetherresrc/drizzle.png";
            }
            else if(data.weather[0].main == "Mist"){
                whetherIcon.src = "whetherresrc/mist.png";
            }
            else if(data.weather[0].main == "Snow"){
                whetherIcon.src = "whetherresrc/snow.png";
            }
            document.querySelector(".whether").style.display = "block" ,                 document.querySelector(".error").style.display = "none";
        }
        searchBtn.addEventListener("click", ()=>{
            checkWhether(searchBox.value);
        })
        checkWhether();
    </script>
</body>
</html>
