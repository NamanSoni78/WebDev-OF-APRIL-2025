<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Profile</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* #upPart{

        } */
    </style>
</head>

<body>
    <div class="container">
        <div class="main">
            <section id="upperPart">
                <h2 id="username">goodboy91202</h2>
                <p id="arrow">&#9662</p>
                <section id="upperPartRight">
                    <button class="upperButton">
                        <div id="at">@</div>
                    </button>
                    <button class="upperButton">
                        <div id="plus">+</div>
                    </button>
                    <button class="upperButton">
                        <div id="setting">&#9776</div>
                    </button>
                </section>
            </section>
            <div id="upPart">
                <img src="download.png" id="pPic">
                <div id="pInfo">
                    <div id="pB">
                        <h5 id="pName">Zlon Musk</h5>
                        <img src="verified2.0.gif" id="bTick">
                    </div>
                    <div id="pStats">
                        <div id="posts">
                            <h6>78</h6>
                            <p>posts</p>
                        </div>
                        <div id="followers">
                            <h6>28M</h6>
                            <p>followers</p>
                        </div>
                        <div class="following">
                            <h6>1</h6>
                            <p>following</p>
                        </div>
                    </div>
                </div>

            </div>
            <div id="lPart">
                <button class="lowerButton">
                    <div class="icons">&#x1F3E0</div>
                </button>
                <button class="lowerButton">
                    <div class="icons">&#x1F50D</div>
                </button>
                <button class="lowerButton">
                    <div class="icons">+</div>
                </button>
                <button class="lowerButton">
                    <div class="icons">&#127909</div>
                </button>
                <button class="lowerButton">
                    <div class="icons">&#x1F464</div>
                </button>
            </div>
        </div>
    </div>

</body>

</html>
